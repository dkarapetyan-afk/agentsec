[package]
name = "agentsec"
version = "0.2.0"
edition = "2021"
description = "A local daemon and CLI that securely manages namespaced secrets for coding agents"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/dkarapetyan-afk/agentsec"
homepage = "https://github.com/dkarapetyan-afk/agentsec"
documentation = "https://docs.rs/agentsec"
keywords = ["secrets", "security", "ai-agents", "mcp", "credentials"]
categories = ["command-line-utilities", "cryptography", "development-tools"]
exclude = [
    ".grok/",
    ".cursor/",
    "session-id",
    "agentsec-watchdog.sh",
    "agentsec.logrotate",
    "install-skill.sh",
    "contrib/",
    ".github/",
]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
argon2 = "0.6"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
directories = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
