name: Bug Report
description: File a bug report or unexpected behavior in agentsec
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please do **not** post real secrets, private keys, or API credentials in bug reports.
  - type: input
    id: version
    attributes:
      label: agentsec Version
      description: What version of agentsec are you using? (Run `agentsec --version` or `agentsec doctor`)
      placeholder: e.g. 0.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System & Architecture
      description: Which OS and architecture are you running?
      placeholder: e.g. Ubuntu 22.04 LTS (x86_64) / macOS 14.2 (Apple Silicon) / Windows 11
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start daemon with `agentsec daemon`
        2. Run `agentsec set MY_KEY`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Logs / Terminal Output
      description: Please paste any relevant sanitized logs (run `agentsec doctor` or check terminal output).
      render: shell
