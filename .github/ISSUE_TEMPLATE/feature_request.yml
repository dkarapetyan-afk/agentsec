name: Feature Request
description: Suggest an idea or enhancement for agentsec
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a problem or workflow limitation?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Enhancement
      description: Describe what you would like to see added or changed in agentsec.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, CLI mockups, or screenshots about the feature request here.
